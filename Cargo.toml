[workspace]
resolver = "3"
members = ["crates/*", "tests/interop", "tests/external"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/danielnie001/rurge"

[workspace.dependencies]
rurge-config = { path = "crates/rurge-config" }
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
fancy-regex = "0.14"
ipnet = "2"
tempfile = "3"
insta = { version = "1", features = ["yaml"] }
assert_cmd = "2"
predicates = "3"
rurge-net = { path = "crates/rurge-net" }
rurge-rules = { path = "crates/rurge-rules" }
rurge-platform = { path = "crates/rurge-platform" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "fs", "sync", "macros", "io-util", "signal"] }
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio", "server", "server-auto"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
tower-service = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = "0.8"
webpki-roots = "1"
url = "2"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
notify = "8"
arc-swap = "1"
prefix-trie = "0.10"
maxminddb = "0.30"
tracing = "0.1"
proptest = "1"
rcgen = "0.14"
criterion = "0.8"
toml = "0.8"
rurge-dns = { path = "crates/rurge-dns" }
hickory-proto = "0.26"
lru = "0.18"
resolv-conf = "0.7"
ipconfig = "0.3"
if-addrs = "0.15"
tracing-subscriber = "0.3"
rurge-proto = { path = "crates/rurge-proto" }
rurge-policy = { path = "crates/rurge-policy" }
rurge-inbound = { path = "crates/rurge-inbound" }
rurge-engine = { path = "crates/rurge-engine" }
base64 = "0.22"
tokio-util = { version = "0.7", features = ["rt"] }
tracing-appender = "0.2"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
rurge-api = { path = "crates/rurge-api" }
windows-registry = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Networking_WinInet"] }
nix = { version = "0.31", default-features = false }
socket2 = { version = "0.6", features = ["all"] }
p12-keystore = "0.2"
getrandom = "0.3"
idna = "1"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
ring = "0.17"
aes = "0.8"
md-5 = "0.10"
# Shadowsocks AEAD: AES-GCM of all three key sizes (aes-192-gcm has no type
# alias), ChaCha20- and XChaCha20-Poly1305 at the version already in the tree,
# HKDF-SHA1 for the session subkey
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes"] }
chacha20poly1305 = { version = "0.10.1", default-features = false }
hkdf = "0.13"
sha1 = { version = "0.11", default-features = false }
sha3 = "0.10"
crc32fast = "1"
rurge-proto-ssh = { path = "crates/rurge-proto-ssh" }
# ring, not the default aws-lc-rs (cmake and NASM on Windows); no des, no dsa
russh = { version = "0.63.3", default-features = false, features = ["ring", "rsa"] }
rand = "0.10"
rurge-proto-wireguard = { path = "crates/rurge-proto-wireguard" }
# only the sans-IO `noise::Tunn`: 0.7.1 has no default features, and
# `default-features = false` keeps it that way (`device` is a whole TUN driver)
boringtun = { version = "0.7.1", default-features = false }
# the tunnel's own IP stack: TCP with Reno congestion control, UDP for the tunnel's
# DNS, fragments of up to 16 KiB reassembled; no phy, no log
smoltcp = { version = "0.12.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "proto-ipv4-fragmentation", "proto-ipv6-fragmentation", "socket-tcp", "socket-tcp-reno", "socket-udp", "async", "reassembly-buffer-size-16384", "reassembly-buffer-count-4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
