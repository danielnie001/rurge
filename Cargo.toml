[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/danielnie001/rurge"

[workspace.dependencies]
rurge-config = { path = "crates/rurge-config" }
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
fancy-regex = "0.14"
ipnet = "2"
tempfile = "3"
insta = { version = "1", features = ["yaml"] }
assert_cmd = "2"
predicates = "3"
rurge-net = { path = "crates/rurge-net" }
rurge-rules = { path = "crates/rurge-rules" }
rurge-platform = { path = "crates/rurge-platform" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "fs", "sync", "macros", "io-util", "signal"] }
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio", "server", "server-auto"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
tower-service = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = "0.8"
webpki-roots = "1"
url = "2"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
notify = "8"
arc-swap = "1"
prefix-trie = "0.10"
maxminddb = "0.30"
tracing = "0.1"
proptest = "1"
rcgen = "0.14"
criterion = "0.8"
toml = "0.8"
rurge-dns = { path = "crates/rurge-dns" }
hickory-proto = "0.26"
lru = "0.18"
resolv-conf = "0.7"
ipconfig = "0.3"
if-addrs = "0.15"
tracing-subscriber = "0.3"
rurge-proto = { path = "crates/rurge-proto" }
rurge-policy = { path = "crates/rurge-policy" }
rurge-inbound = { path = "crates/rurge-inbound" }
rurge-engine = { path = "crates/rurge-engine" }
base64 = "0.22"
tokio-util = { version = "0.7", features = ["rt"] }
tracing-appender = "0.2"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
rurge-api = { path = "crates/rurge-api" }
windows-registry = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Networking_WinInet"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
