[package]
name = "rurge-platform"
description = "Platform-specific helpers for rurge (directories, system DNS)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tracing.workspace = true
resolv-conf.workspace = true
if-addrs.workspace = true

# `ipconfig`'s build script emits `cargo:rustc-link-lib=iphlpapi` unconditionally,
# which breaks linking on Linux / macOS, so it is a Windows-only dependency.
[target.'cfg(windows)'.dependencies]
ipconfig.workspace = true

[lints]
workspace = true
