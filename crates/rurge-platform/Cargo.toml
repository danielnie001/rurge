[package]
name = "rurge-platform"
description = "Platform-specific helpers for rurge (directories, system DNS, system proxy, service install, external programs)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tracing.workspace = true
resolv-conf.workspace = true
if-addrs.workspace = true
serde.workspace = true
serde_json.workspace = true
socket2.workspace = true

# `ipconfig`'s build script emits `cargo:rustc-link-lib=iphlpapi` unconditionally,
# which breaks linking on Linux / macOS, so it is a Windows-only dependency.
[target.'cfg(windows)'.dependencies]
ipconfig.workspace = true
windows-registry.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# killpg for an external program's process group (`process`)
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal"] }

[dev-dependencies]
tempfile.workspace = true

# The workspace lints, except `unsafe_code`: notifying WinINet that the proxy
# settings changed (`sysproxy::windows`) and putting an external program in a
# Job Object (`process`) are FFI calls. The lint stays `deny` here and only
# those two functions opt out; every other crate keeps `forbid`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
