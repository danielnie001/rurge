[package]
name = "rurge-proto"
description = "Outbound abstraction and the built-in DIRECT / REJECT outbounds for rurge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rurge-config.workspace = true
rurge-net.workspace = true
tokio.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
sha2.workspace = true
base64.workspace = true
rcgen = { workspace = true, optional = true }
p12-keystore.workspace = true

[features]
# Scriptable loopback peers (`rurge_proto::testing`); enabled by dependants' dev-dependencies.
testing = ["dep:rcgen"]

[dev-dependencies]
rcgen.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
