name: CI
on:
  push:
    branches: [main]
  pull_request:
# The MSRV, which the local gate runs too: a newer clippy brings new lints
# that `-D warnings` turns into errors. The variable outranks
# rust-toolchain.toml's `stable`, which would pick the runner's latest.
env:
  RUSTUP_TOOLCHAIN: 1.89.0
  # An interoperability case whose reference server is missing fails instead
  # of skipping, on the platforms the server is installed for (each fixture
  # knows its own). Set here and not by an install step: were that step to
  # fail, the variable would stay unset and every case would skip in silence.
  RURGE_INTEROP_REQUIRED: 1
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # A reference server that cannot be installed — a download that fails,
      # an asset that moved — costs its own cases and nothing else: the step
      # does not end the job, RURGE_INTEROP_REQUIRED fails each case that
      # needs the server, and everything else still runs and reports. The
      # same goes for every install step below.
      - name: Install sing-box for the interoperability tests
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          version=1.14.2
          case "$RUNNER_OS" in
            Linux)   asset="sing-box-$version-linux-amd64.tar.gz";  sha=a684484d7477d1437282ee411f4d131d0340aaad60a7868841ebd5d87dd8a0c6 ;;
            Windows) asset="sing-box-$version-windows-amd64.zip";   sha=c2d8bfff918755808781dfdeeb8581b6c91eb3a243d9a7b55483cfc0c0684d32 ;;
            macOS)   asset="sing-box-$version-darwin-arm64.tar.gz"; sha=925c5382eca8492b0150f868a6db20b18290a38700e621724b3703fd453e032d ;;
            *) echo "unexpected runner OS: $RUNNER_OS"; exit 1 ;;
          esac
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 --retry-all-errors -o "$asset" "https://github.com/SagerNet/sing-box/releases/download/v$version/$asset"
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum "$asset" | cut -d' ' -f1)
          else
            actual=$(shasum -a 256 "$asset" | cut -d' ' -f1)
          fi
          if [ "$actual" != "$sha" ]; then
            echo "sing-box checksum mismatch: expected $sha, got $actual"
            exit 1
          fi
          mkdir -p sing-box
          case "$asset" in
            *.zip) unzip -q "$asset" -d sing-box ;;
            *)     tar -xzf "$asset" -C sing-box ;;
          esac
          bin=$(find "$PWD/sing-box" -type f \( -name sing-box -o -name sing-box.exe \) | head -n 1)
          [ -n "$bin" ] || { echo "no sing-box binary in $asset"; exit 1; }
          chmod +x "$bin"
          if [ "$RUNNER_OS" = "Windows" ]; then bin=$(cygpath -w "$bin"); fi
          echo "RURGE_TEST_SING_BOX=$bin" >> "$GITHUB_ENV"
      - name: Install xray for the VMess interoperability tests
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          version=26.3.27
          case "$RUNNER_OS" in
            Linux)   asset="Xray-linux-64.zip";        sha=23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae ;;
            Windows) asset="Xray-windows-64.zip";      sha=d004c39288ce9ada487c6f398c7c545f7d749e44bdfdd59dbc9f865afba4e1ad ;;
            macOS)   asset="Xray-macos-arm64-v8a.zip"; sha=2e93a67e8aa1936ecefb307e120830fcbd4c643ab9b1c46a2d0838d5f8409eaf ;;
            *) echo "unexpected runner OS: $RUNNER_OS"; exit 1 ;;
          esac
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 --retry-all-errors -o "$asset" "https://github.com/XTLS/Xray-core/releases/download/v$version/$asset"
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum "$asset" | cut -d' ' -f1)
          else
            actual=$(shasum -a 256 "$asset" | cut -d' ' -f1)
          fi
          if [ "$actual" != "$sha" ]; then
            echo "xray checksum mismatch: expected $sha, got $actual"
            exit 1
          fi
          mkdir -p xray
          unzip -q "$asset" -d xray
          bin=$(find "$PWD/xray" -type f \( -name xray -o -name xray.exe \) | head -n 1)
          [ -n "$bin" ] || { echo "no xray binary in $asset"; exit 1; }
          chmod +x "$bin"
          if [ "$RUNNER_OS" = "Windows" ]; then bin=$(cygpath -w "$bin"); fi
          echo "RURGE_TEST_XRAY=$bin" >> "$GITHUB_ENV"
      - name: Install shadowsocks-rust for the Shadowsocks interoperability tests
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          version=1.25.0
          case "$RUNNER_OS" in
            Linux)   asset="shadowsocks-v$version.x86_64-unknown-linux-gnu.tar.xz"; sha=874f817fcf3e6d7681ec715a1c13c686c6eaae936524d102639b38364f3966ae ;;
            Windows) asset="shadowsocks-v$version.x86_64-pc-windows-msvc.zip";     sha=882151ea5c52941d4a3360ebd12c74c6d6bd1b599596089ef1811b379c705666 ;;
            macOS)   asset="shadowsocks-v$version.aarch64-apple-darwin.tar.xz";    sha=58e0caf0cc9266c4ea226f38aa20fb28c1be12efc87a73cf5903197867555208 ;;
            *) echo "unexpected runner OS: $RUNNER_OS"; exit 1 ;;
          esac
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 --retry-all-errors -o "$asset" "https://github.com/shadowsocks/shadowsocks-rust/releases/download/v$version/$asset"
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum "$asset" | cut -d' ' -f1)
          else
            actual=$(shasum -a 256 "$asset" | cut -d' ' -f1)
          fi
          if [ "$actual" != "$sha" ]; then
            echo "shadowsocks-rust checksum mismatch: expected $sha, got $actual"
            exit 1
          fi
          mkdir -p shadowsocks-rust
          case "$asset" in
            *.zip) unzip -q "$asset" -d shadowsocks-rust ;;
            *)     tar -xJf "$asset" -C shadowsocks-rust ;;
          esac
          bin=$(find "$PWD/shadowsocks-rust" -type f \( -name ssserver -o -name ssserver.exe \) | head -n 1)
          [ -n "$bin" ] || { echo "no ssserver binary in $asset"; exit 1; }
          chmod +x "$bin"
          if [ "$RUNNER_OS" = "Windows" ]; then bin=$(cygpath -w "$bin"); fi
          echo "RURGE_TEST_SSSERVER=$bin" >> "$GITHUB_ENV"
      - name: Install snell-server for the Snell interoperability tests
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          version=5.0.1
          asset="snell-server-v$version-linux-amd64.zip"
          sha=9bea1c2b9e35b73b31634856c04d18c393072b9e5dcde6a32781d8b8f908c539
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 --retry-all-errors -o "$asset" "https://dl.nssurge.com/snell/$asset"
          actual=$(sha256sum "$asset" | cut -d' ' -f1)
          if [ "$actual" != "$sha" ]; then
            echo "snell-server checksum mismatch: expected $sha, got $actual"
            exit 1
          fi
          mkdir -p snell-server
          unzip -q "$asset" -d snell-server
          bin=$(find "$PWD/snell-server" -type f -name snell-server | head -n 1)
          [ -n "$bin" ] || { echo "no snell-server binary in $asset"; exit 1; }
          chmod +x "$bin"
          echo "RURGE_TEST_SNELL_SERVER=$bin" >> "$GITHUB_ENV"
      - name: Install the tuic 0.8.5 server for the TUIC v4 interoperability tests
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          version=0.8.5
          asset="tuic-server-$version-x86_64-linux-musl"
          # GitHub publishes no `digest` for this release's assets: the
          # SHA-256 is the one the release's own checksum file gives,
          # `tuic-server-0.8.5-x86_64-linux-musl.sha256sum`
          # (tests/interop/README.md, "tuic-server").
          sha=e4b5d5dcc15209f28de1c8a9ea12edba8a71c35442b4c53177309f728406726c
          if ! [[ "$sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "tuic-server: no SHA-256 is pinned for $asset; see tests/interop/README.md"
            exit 1
          fi
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 --retry-all-errors -o "$asset" "https://github.com/tuic-protocol/tuic/releases/download/$version/$asset"
          actual=$(sha256sum "$asset" | cut -d' ' -f1)
          if [ "$actual" != "$sha" ]; then
            echo "tuic-server checksum mismatch: expected $sha, got $actual"
            exit 1
          fi
          mkdir -p tuic-server
          mv "$asset" tuic-server/tuic-server
          chmod +x tuic-server/tuic-server
          echo "RURGE_TEST_TUIC_SERVER=$PWD/tuic-server/tuic-server" >> "$GITHUB_ENV"
      - name: Install the TrustTunnel endpoint for the HTTP/2 and HTTP/3 interoperability tests
        if: runner.os != 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          version=1.1.0
          case "$RUNNER_OS" in
            Linux) asset="trusttunnel-v$version-linux-x86_64.tar.gz";  sha=91c2ea3db7416a01b5258a4c047ec22890490bc55e1b194206031aa75144f0e7 ;;
            macOS) asset="trusttunnel-v$version-macos-universal.tar.gz"; sha=126a5688e922ce8f83d4de2d8a2659b3aab97820184d30f2edbecc0ec4a32ae5 ;;
            *) echo "unexpected runner OS: $RUNNER_OS"; exit 1 ;;
          esac
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 --retry-all-errors -o "$asset" "https://github.com/TrustTunnel/TrustTunnel/releases/download/v$version/$asset"
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum "$asset" | cut -d' ' -f1)
          else
            actual=$(shasum -a 256 "$asset" | cut -d' ' -f1)
          fi
          if [ "$actual" != "$sha" ]; then
            echo "TrustTunnel checksum mismatch: expected $sha, got $actual"
            exit 1
          fi
          mkdir -p trusttunnel
          tar -xzf "$asset" -C trusttunnel
          bin=$(find "$PWD/trusttunnel" -type f -name trusttunnel_endpoint | head -n 1)
          [ -n "$bin" ] || { echo "no trusttunnel_endpoint binary in $asset"; exit 1; }
          chmod +x "$bin"
          echo "RURGE_TEST_TRUSTTUNNEL=$bin" >> "$GITHUB_ENV"
      - name: Install masque-server for the MASQUE interoperability tests
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          version=0.13.0
          asset="masque-v$version-linux-x86_64.tar.gz"
          sha=0ae2e3359db5149670df0d084e86104bf0332d0fd43501c9072ec39a48a1f298
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 --retry-all-errors -o "$asset" "https://github.com/Vincent-bin/masque-server/releases/download/v$version/$asset"
          actual=$(sha256sum "$asset" | cut -d' ' -f1)
          if [ "$actual" != "$sha" ]; then
            echo "masque-server checksum mismatch: expected $sha, got $actual"
            exit 1
          fi
          mkdir -p masque-server
          tar -xzf "$asset" -C masque-server
          bin=$(find "$PWD/masque-server" -type f -name masque-server | head -n 1)
          [ -n "$bin" ] || { echo "no masque-server binary in $asset"; exit 1; }
          chmod +x "$bin"
          echo "RURGE_TEST_MASQUE_SERVER=$bin" >> "$GITHUB_ENV"
      - name: Install dnsproxy for the DNS over QUIC and HTTP/3 interoperability tests
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          version=0.86.0
          case "$RUNNER_OS" in
            Linux)   asset="dnsproxy-linux-amd64-v$version.tar.gz";  sha=17ac43f76ebfcedf547c663f6f31aa70e68b8eb6fc41d2fc37d3bfe21a2ced66 ;;
            Windows) asset="dnsproxy-windows-amd64-v$version.zip";   sha=dedc186ddd4b96bf92474f91d972f67da0824e0141d09e3102fd96db9f8a0dbc ;;
            macOS)   asset="dnsproxy-darwin-arm64-v$version.tar.gz"; sha=5964db3a45d39df4e41f74907f50657a80907c514355f9ad75b9666e3431d277 ;;
            *) echo "unexpected runner OS: $RUNNER_OS"; exit 1 ;;
          esac
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 --retry-all-errors -o "$asset" "https://github.com/AdguardTeam/dnsproxy/releases/download/v$version/$asset"
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum "$asset" | cut -d' ' -f1)
          else
            actual=$(shasum -a 256 "$asset" | cut -d' ' -f1)
          fi
          if [ "$actual" != "$sha" ]; then
            echo "dnsproxy checksum mismatch: expected $sha, got $actual"
            exit 1
          fi
          mkdir -p dnsproxy
          case "$asset" in
            *.zip) unzip -q "$asset" -d dnsproxy ;;
            *)     tar -xzf "$asset" -C dnsproxy ;;
          esac
          bin=$(find "$PWD/dnsproxy" -type f \( -name dnsproxy -o -name dnsproxy.exe \) | head -n 1)
          [ -n "$bin" ] || { echo "no dnsproxy binary in $asset"; exit 1; }
          chmod +x "$bin"
          if [ "$RUNNER_OS" = "Windows" ]; then bin=$(cygpath -w "$bin"); fi
          echo "RURGE_TEST_DNSPROXY=$bin" >> "$GITHUB_ENV"
      - name: Install CoreDNS for the DNS over QUIC and HTTP/3 interoperability tests
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          version=1.14.7
          case "$RUNNER_OS" in
            Linux)   asset="coredns_${version}_linux_amd64.tgz";   sha=9a09356438c6d9591cb80011a2a7a52f87fc3a113f6690e41f243f98b98faac9 ;;
            Windows) asset="coredns_${version}_windows_amd64.tgz"; sha=19756e969e4ddd16ee0c189018e5659f6695113223e590709222433f7338504d ;;
            macOS)   asset="coredns_${version}_darwin_arm64.tgz";  sha=0005d154d49c73a88b2c56f429f35106e46c4ca37ee6de4e4d482d7de5c4b8ba ;;
            *) echo "unexpected runner OS: $RUNNER_OS"; exit 1 ;;
          esac
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 --retry-all-errors -o "$asset" "https://github.com/coredns/coredns/releases/download/v$version/$asset"
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum "$asset" | cut -d' ' -f1)
          else
            actual=$(shasum -a 256 "$asset" | cut -d' ' -f1)
          fi
          if [ "$actual" != "$sha" ]; then
            echo "CoreDNS checksum mismatch: expected $sha, got $actual"
            exit 1
          fi
          mkdir -p coredns
          tar -xzf "$asset" -C coredns
          bin=$(find "$PWD/coredns" -type f \( -name coredns -o -name coredns.exe \) | head -n 1)
          [ -n "$bin" ] || { echo "no coredns binary in $asset"; exit 1; }
          chmod +x "$bin"
          if [ "$RUNNER_OS" = "Windows" ]; then bin=$(cygpath -w "$bin"); fi
          echo "RURGE_TEST_COREDNS=$bin" >> "$GITHUB_ENV"
      - name: Install mihomo for the Snell v1 to v3, Shadowsocks chacha20 and simple-obfs interoperability tests
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          version=1.19.32
          # The amd64 builds are the `v1` ones: they run on any x86-64.
          case "$RUNNER_OS" in
            Linux)   asset="mihomo-linux-amd64-v1-v$version.gz";    sha=306f81e723e60ce6b828899a6fe83e1d00e9ecefb2dc8d4d849312a5bc00efdc ;;
            Windows) asset="mihomo-windows-amd64-v1-v$version.zip"; sha=00549b347d8e124600e46cac67d59293358454f465e9d86d2511567da56b7029 ;;
            macOS)   asset="mihomo-darwin-arm64-v$version.gz";      sha=3312a6780652c622890fd4357c6a853bbf865464fd047ac7b7f52dab8de18652 ;;
            *) echo "unexpected runner OS: $RUNNER_OS"; exit 1 ;;
          esac
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 --retry-all-errors -o "$asset" "https://github.com/MetaCubeX/mihomo/releases/download/v$version/$asset"
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum "$asset" | cut -d' ' -f1)
          else
            actual=$(shasum -a 256 "$asset" | cut -d' ' -f1)
          fi
          if [ "$actual" != "$sha" ]; then
            echo "mihomo checksum mismatch: expected $sha, got $actual"
            exit 1
          fi
          mkdir -p mihomo
          case "$asset" in
            *.zip)
              unzip -q "$asset" -d mihomo
              bin=$(find "$PWD/mihomo" -type f -name '*.exe' | head -n 1)
              ;;
            *)
              # The executable itself, gzipped: not a tar archive.
              gunzip -c "$asset" > mihomo/mihomo
              bin="$PWD/mihomo/mihomo"
              ;;
          esac
          [ -n "$bin" ] || { echo "no mihomo binary in $asset"; exit 1; }
          chmod +x "$bin"
          if [ "$RUNNER_OS" = "Windows" ]; then bin=$(cygpath -w "$bin"); fi
          echo "RURGE_TEST_MIHOMO=$bin" >> "$GITHUB_ENV"
      - name: Point the SSH interoperability tests at OpenSSH's sshd
        if: runner.os != 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          if [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends openssh-server
          fi
          echo "RURGE_TEST_SSHD=/usr/sbin/sshd" >> "$GITHUB_ENV"
      # Every test binary runs, whatever fails before it: the interoperability
      # tests are the last ones, and one run should say everything it can.
      - name: Run the tests
        shell: bash
        timeout-minutes: 60
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/test.log"
      # The log is readable only when signed in; annotations and the job
      # summary are public.
      - name: Report the failed tests
        if: failure()
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then python=python; else python=python3; fi
          "$python" .github/scripts/report-test-failures.py "$RUNNER_TEMP/test.log"
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -p rurge-rules --no-run
      - run: cargo bench -p rurge-dns --no-run
